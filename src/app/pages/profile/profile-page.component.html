<div class="container mx-auto px-4 py-8">
    <div *ngIf="isLoading" class="flex justify-center items-center h-64">
        <p-progressSpinner ariaLabel="loading"></p-progressSpinner>
    </div>

    <div *ngIf="!isLoading && profile" class="bg-white rounded-lg shadow-md overflow-hidden">
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 px-6 py-8 text-white">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="relative">
                    <img [src]="profile.avatarUrl || 'assets/images/default-avatar.png'" 
                         alt="Avatar" 
                         class="w-32 h-32 rounded-full border-4 border-white shadow-lg object-cover">
                </div>
                <div class="text-center md:text-left">
                    <h1 class="text-3xl font-bold">{{ profile.fullName }}</h1>
                    <p class="text-blue-100 mt-1">{{ profile.email }}</p>
                    <p class="mt-4 text-blue-50 text-sm max-w-2xl" *ngIf="profile.bio">
                        {{ profile.bio }}
                    </p>
                    <div class="mt-4 flex items-center justify-center md:justify-start gap-4 text-xs text-blue-100">
                        <span><i class="pi pi-calendar mr-1"></i> Joined {{ profile.joinedDate | date:'mediumDate' }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs Section -->
        <div class="p-6">
            <p-tabView [(activeIndex)]="activeTabIndex">
                <p-tabPanel header="Overview">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <h3 class="text-lg font-semibold mb-4 flex items-center">
                                <i class="pi pi-user mr-2 text-blue-500"></i> Basic Information
                            </h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="text-gray-500 text-sm">Full Name</label>
                                    <p class="font-medium">{{ profile.fullName }}</p>
                                </div>
                                <div>
                                    <label class="text-gray-500 text-sm">Email Address</label>
                                    <p class="font-medium">{{ profile.email }}</p>
                                </div>
                                <div>
                                    <label class="text-gray-500 text-sm">Bio</label>
                                    <p class="text-gray-700">{{ profile.bio || 'No bio provided.' }}</p>
                                </div>
                            </div>
                        </div>
                        <div>
                            <app-profile-edit [profile]="profile" (updated)="onProfileUpdated()"></app-profile-edit>
                        </div>
                    </div>
                </p-tabPanel>
                <p-tabPanel header="Recently Viewed">
                    <app-recently-viewed></app-recently-viewed>
                </p-tabPanel>
                <p-tabPanel header="Liked Sheets">
                    <app-profile-likes></app-profile-likes>
                </p-tabPanel>
            </p-tabView>
        </div>
    </div>
</div>
