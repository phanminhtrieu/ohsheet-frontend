<div class="space-y-6">
    <div *ngIf="isLoading" class="flex justify-center items-center h-48">
        <p-progressSpinner ariaLabel="loading"></p-progressSpinner>
    </div>

    <div *ngIf="!isLoading && items.length === 0" class="text-center py-12 bg-gray-50 rounded-lg border-2 border-dashed border-gray-200">
        <i class="pi pi-clock text-4xl text-gray-300 mb-4"></i>
        <p class="text-gray-500">You haven't viewed any music sheets recently.</p>
        <a routerLink="/music-sheet-list" class="text-blue-500 hover:underline mt-2 inline-block">Explore Music Sheets</a>
    </div>

    <div *ngIf="!isLoading && items.length > 0">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Mapping RecentlyViewedMusicSheetDto to MusicSheet structure expected by card -->
            <app-music-sheet-card *ngFor="let item of items" [musicSheet]="item"></app-music-sheet-card>
        </div>
    </div>
</div>
